name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-mcp.txt
      - run: python -m pytest -q
      - name: Validate proxy configuration
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Validate Alloy configuration
        run: |
          docker run --rm -v "$PWD/observability/config.alloy:/etc/alloy/config.alloy:ro" \
            -e GRAFANA_METRICS_URL=https://metrics.example.invalid/api/prom/push \
            -e GRAFANA_METRICS_USER=1 \
            -e GRAFANA_LOGS_URL=https://logs.example.invalid/loki/api/v1/push \
            -e GRAFANA_LOGS_USER=1 -e GRAFANA_CLOUD_TOKEN=validation-only \
            -e POROVNU_COMPOSE_PROJECT=rashod \
            grafana/alloy:v1.22.0 validate /etc/alloy/config.alloy

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ghcr.io/${{ github.repository }}-mcp:latest
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy with secrets
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: "true"
