name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ghcr.io/${{ github.repository }}-mcp:latest
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          AGE_DEPLOY_KEY_B64: ${{ secrets.AGE_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${AGE_DEPLOY_KEY_B64:-}" ]]; then
            echo "AGE_DEPLOY_KEY_B64 secret is empty" >&2
            exit 1
          fi

          KEY_FILE="${RUNNER_TEMP}/deploy_key"
          AGE_FILE="${RUNNER_TEMP}/age-deploy.key"
          install -m 600 /dev/null "$KEY_FILE"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_FILE"

          printf '%s' "$AGE_DEPLOY_KEY_B64" | base64 -d > "$AGE_FILE"
          chmod 600 "$AGE_FILE"
          grep -q 'AGE-SECRET-KEY-' "$AGE_FILE"
          echo "local age key ok ($(wc -c < "$AGE_FILE") bytes)"

          SSH=(ssh -i "$KEY_FILE" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          SCP=(scp -i "$KEY_FILE" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"

          "${SSH[@]}" "$REMOTE" 'mkdir -p /home/biga/rashod/keys && chmod 700 /home/biga/rashod/keys'
          "${SCP[@]}" "$AGE_FILE" "${REMOTE}:/home/biga/rashod/keys/age-deploy.key"
          "${SSH[@]}" "$REMOTE" 'chmod 600 /home/biga/rashod/keys/age-deploy.key && grep -q AGE-SECRET-KEY- /home/biga/rashod/keys/age-deploy.key && echo age-key-ok'

          "${SSH[@]}" "$REMOTE" 'set -euo pipefail; cd /home/biga/rashod; test -s keys/age-deploy.key; ok=0; for i in 1 2 3 4 5; do if git pull --ff-only; then ok=1; break; fi; echo "git pull failed (attempt $i); retrying…" >&2; sleep $((i * 5)); done; [[ "$ok" == 1 ]]; test -s keys/age-deploy.key; export SKIP_GIT_PULL=1; ./deploy.sh'
