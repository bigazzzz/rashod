name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ghcr.io/${{ github.repository }}-mcp:latest
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Decode age-deploy key
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.AGE_DEPLOY_KEY_B64 }}" ]]; then
            echo "AGE_DEPLOY_KEY_B64 secret is empty" >&2
            exit 1
          fi
          echo "${{ secrets.AGE_DEPLOY_KEY_B64 }}" | base64 -d > age-deploy.key
          chmod 600 age-deploy.key
          grep -q 'AGE-SECRET-KEY-' age-deploy.key
          echo "decoded age-deploy.key ($(wc -c < age-deploy.key) bytes)"

      - name: Upload age-deploy key
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: age-deploy.key
          target: /home/biga/rashod/keys/
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # One logical flow; retries live in deploy.sh. Avoid complex multiline + appleboy envs.
          script: "set -euo pipefail; cd /home/biga/rashod; test -s keys/age-deploy.key; grep -q AGE-SECRET-KEY- keys/age-deploy.key; echo age-key-ok; git pull --ff-only || git pull --ff-only || git pull --ff-only; export SKIP_GIT_PULL=1; ./deploy.sh"
