name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ghcr.io/${{ github.repository }}-mcp:latest
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install sops
        run: |
          curl -fsSL -o /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
          chmod 755 /usr/local/bin/sops

      - name: Decrypt secrets and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          AGE_DEPLOY_KEY_B64: ${{ secrets.AGE_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "${AGE_DEPLOY_KEY_B64:-}" ]]; then
            echo "AGE_DEPLOY_KEY_B64 secret is empty" >&2
            exit 1
          fi

          AGE_FILE="${RUNNER_TEMP}/age-deploy.key"
          ENV_SECRETS="${RUNNER_TEMP}/env.secrets"
          KEY_FILE="${RUNNER_TEMP}/deploy_key"
          REMOTE_SCRIPT="${RUNNER_TEMP}/remote-deploy.sh"

          install -m 600 /dev/null "$KEY_FILE"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_FILE"

          printf '%s' "$AGE_DEPLOY_KEY_B64" | base64 -d > "$AGE_FILE"
          chmod 600 "$AGE_FILE"
          grep -q 'AGE-SECRET-KEY-' "$AGE_FILE"
          echo "local age key ok ($(wc -c < "$AGE_FILE") bytes)"

          SOPS_AGE_KEY_FILE="$AGE_FILE" sops -d --output-type dotenv secrets.enc.yaml > "$ENV_SECRETS"
          chmod 600 "$ENV_SECRETS"
          grep -q '^OPS_TOKEN=' "$ENV_SECRETS"
          grep -q '^MCP_TOKEN=' "$ENV_SECRETS"
          echo "decrypted .env.secrets ($(wc -l < "$ENV_SECRETS") lines)"

          SECRETS_B64="$(base64 -w0 < "$ENV_SECRETS")"
          # Build remote script on the runner (delimiter at BOL after YAML indent strip).
          cat > "$REMOTE_SCRIPT" <<EOF
          set -euo pipefail
          cd /home/biga/rashod
          printf '%s' '${SECRETS_B64}' | base64 -d > .env.secrets
          chmod 600 .env.secrets
          test -s .env.secrets
          echo secrets-file-ok
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --ff-only; then ok=1; break; fi
            echo "git pull failed (attempt \$i); retrying…" >&2
            sleep \$((i * 5))
          done
          [[ "\$ok" == 1 ]]
          test -s .env.secrets
          export SKIP_GIT_PULL=1
          ./deploy.sh
          EOF
          # Drop YAML-preserved indent from the generated script.
          sed -i 's/^[[:space:]]*//' "$REMOTE_SCRIPT"
          echo "remote script ready ($(wc -l < "$REMOTE_SCRIPT") lines)"

          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -i "$KEY_FILE" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$REMOTE" \
            'bash --noprofile --norc -s' < "$REMOTE_SCRIPT"
