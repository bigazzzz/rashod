name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ghcr.io/${{ github.repository }}-mcp:latest
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/biga/rashod
            mkdir -p keys
            umask 077
            # Inject base64 age key via GitHub secret expansion (A-Za-z0-9+/= only; no appleboy envs — they were not reaching the remote).
            printf '%s' '${{ secrets.AGE_DEPLOY_KEY_B64 }}' | base64 -d > keys/age-deploy.key
            chmod 600 keys/age-deploy.key
            grep -q 'AGE-SECRET-KEY-' keys/age-deploy.key
            echo "age-deploy.key ready ($(wc -c < keys/age-deploy.key) bytes)"
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --ff-only; then ok=1; break; fi
              echo "git pull failed (attempt $i); retrying…" >&2
              sleep $((i * 5))
            done
            [[ "$ok" == 1 ]] || { echo "git pull failed" >&2; exit 1; }
            export SKIP_GIT_PULL=1
            ./deploy.sh
