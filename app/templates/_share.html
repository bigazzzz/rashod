  <div class="share-row">
    <input type="text" id="share-link" value="{{ share_url }}" readonly onclick="this.select()">
    <div class="share-actions">
      <button type="button" id="share-btn" data-event-name="{{ share_title }}">Поделиться</button>
      <button type="button" id="qr-btn" aria-expanded="false" aria-controls="qr-panel" aria-label="Показать QR-код" title="QR-код">
        <svg class="qr-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm12.5-2h1.5v1.5H17.5V11zm-2 2H17v1.5h-1.5V13zm2 2H19v1.5h-1.5V15zm2-2H21v1.5h-1.5V13zm-4 4H17V21h-1.5v-2.5H13V17h2.5v-1.5H17V17zm4 0H21V21h-3.5v-1.5H19V17h1.5v-1.5H21V17z"/>
        </svg>
      </button>
      <button type="button" id="copy-btn" class="icon-share-btn" aria-label="Копировать ссылку" title="Копировать ссылку">
        <svg class="copy-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="qr-panel" class="qr-panel" hidden>
    <div id="qr-code" class="qr-code" role="img" aria-label="QR-код ссылки"></div>
    <p class="hint">{{ share_qr_hint }}</p>
  </div>
