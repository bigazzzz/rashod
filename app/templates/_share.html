  <div class="share-row">
    <input type="text" id="share-link" value="{{ share_url }}" readonly onclick="this.select()">
    <div class="share-actions">
      <button type="button" id="share-btn" data-event-name="{{ share_title }}">Поделиться</button>
      <button type="button" id="qr-btn" class="btn-icon" aria-expanded="false" aria-controls="qr-panel" aria-label="Показать QR-код" title="QR-код">
        <svg class="btn-icon__svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 3h2v3m4-3v3h-2m0-6h2v2m-6 0h2v2"/>
        </svg>
      </button>
      <button type="button" id="copy-btn" class="btn-icon" aria-label="Копировать ссылку" title="Копировать ссылку">
        <svg class="btn-icon__svg copy-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
          <rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 15V5a2 2 0 0 1 2-2h10"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="qr-panel" class="qr-panel" hidden>
    <div id="qr-code" class="qr-code" role="img" aria-label="QR-код ссылки"></div>
    <p class="hint">{{ share_qr_hint }}</p>
  </div>
