<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Админ — Поровну{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/admin.css">
  {% block head %}{% endblock %}
</head>
<body>
  <main class="container container--admin">
    {% if csrf_token is defined and request.url.path != '/admin/login' %}
    <nav class="admin-nav">
      <a href="/admin/">Дашборд</a>
      <a href="/admin/events">События</a>
      <a href="/admin/checks">Smoke</a>
      <form class="admin-nav__logout" method="post" action="/admin/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="btn btn-muted">Выйти</button>
      </form>
    </nav>
    {% endif %}
    {% if notice %}
    <p class="admin-flash admin-flash--ok">{{ notice }}</p>
    {% endif %}
    {% if error %}
    <p class="admin-flash admin-flash--err">{{ error }}</p>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
