<section id="transfer-metro" class="metro" aria-label="Переводы">
  <div class="metro-interactive" hidden>
    <header class="metro-head">
      <div class="metro-total" aria-live="polite">
        <span data-total-label>Сумма переводов</span>
        <strong data-total></strong>
      </div>
      <div class="metro-filter">
        <span id="metro-filter-label">Участник</span>
        <details class="metro-picker">
          <summary aria-labelledby="metro-filter-label metro-filter-value"><span id="metro-filter-value">Все участники</span></summary>
          <div class="metro-options" role="group" aria-labelledby="metro-filter-label">
            <button type="button" data-person="" aria-pressed="true">Все участники</button>
            {% for person in totals %}<button type="button" data-person="{{ person }}" aria-pressed="false">{{ person }}</button>{% endfor %}
          </div>
        </details>
      </div>
    </header>
    <div class="metro-bar">
      <div class="metro-switch" role="group" aria-label="Вид переводов">
        <button type="button" data-view="list" aria-pressed="true">Список</button>
        <button type="button" data-view="map" aria-pressed="false">Схема метро</button>
      </div>
      <span class="metro-count"></span>
    </div>
    <div class="metro-map" hidden>
      <div class="metro-sides"><span>Отправляют</span><span>Получают</span></div>
      <div class="metro-scroll" tabindex="0" aria-label="Маршруты переводов">
        <div class="metro-track">
          <svg class="metro-lines" aria-hidden="true" preserveAspectRatio="none"></svg>
          <div class="metro-fares"></div>
          <div class="metro-stations"></div>
        </div>
      </div>
    </div>
  </div>
  <ul class="metro-list">
    {% for t in transfers %}
    <li data-from="{{ t.from_person }}" data-to="{{ t.to_person }}" data-kopecks="{{ (t.amount * 100)|int }}"><span>{{ t.from_person }} → {{ t.to_person }}:</span> <strong>{{ "%.2f"|format(t.amount) }} ₽</strong></li>
    {% endfor %}
  </ul>
</section>
<script src="/static/metro.js?v=2" defer></script>
