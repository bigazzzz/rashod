<section id="transfer-metro" class="metro" aria-label="Схема переводов">
  <div class="metro-interactive" hidden>
    <header class="metro-head">
      <div class="metro-total" aria-live="polite">
        <span data-total-label>Сумма переводов</span>
        <strong data-total></strong>
      </div>
      <label class="metro-filter">Участник
        <select data-person>
          <option value="">Все участники</option>
          {% for person in totals %}<option value="{{ person }}">{{ person }}</option>{% endfor %}
        </select>
      </label>
    </header>
    <div class="metro-bar">
      <div class="metro-switch" role="group" aria-label="Вид переводов">
        <button type="button" data-view="map" aria-pressed="true">Схема метро</button>
        <button type="button" data-view="list" aria-pressed="false">Список</button>
      </div>
      <span class="metro-count"></span>
    </div>
    <div class="metro-map">
      <div class="metro-sides"><span>Отправляют</span><span>Получают</span></div>
      <div class="metro-scroll" tabindex="0" aria-label="Маршруты переводов">
        <div class="metro-track">
          <svg class="metro-lines" aria-hidden="true" preserveAspectRatio="none"></svg>
          <div class="metro-fares"></div>
          <div class="metro-stations"></div>
        </div>
      </div>
    </div>
  </div>
  <ul class="metro-list">
    {% for t in transfers %}
    <li data-from="{{ t.from_person }}" data-to="{{ t.to_person }}" data-kopecks="{{ (t.amount * 100)|int }}">{{ t.from_person }} → {{ t.to_person }}: <strong>{{ "%.2f"|format(t.amount) }} ₽</strong></li>
    {% endfor %}
  </ul>
</section>
<script src="/static/metro.js" defer></script>
