<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a1024">
  <title>{% block title %}Поровну{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Поровну — сервис, чтобы посчитать поровну чек между друзьями. Создайте событие, скиньте ссылку — и узнайте, кто сколько потратил и кто кому должен.{% endblock %}">
  <meta name="robots" content="{% block robots %}index, follow{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}Поровну — посчитать поровну чек{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Раздели расходы между друзьями: создай событие, отправь ссылку — и получи расклад, кто сколько потратил и кто кому должен.{% endblock %}">
  <meta property="og:locale" content="ru_RU">
  {% block og_url %}{% endblock %}
  {% block og_image %}{% endblock %}
  <meta name="twitter:card" content="{% block twitter_card %}summary{% endblock %}">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <img
      class="hero{% block hero_class %} hero--compact{% endblock %}"
      src="{% block hero_src %}/og/site.jpg{% endblock %}"
      alt="{% block hero_alt %}Превью Поровну{% endblock %}"
      {% block hero_attrs %}width="1200" height="630"{% endblock %}
    >
    {% block content %}{% endblock %}
  </main>
</body>
</html>
