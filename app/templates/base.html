<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Поровну{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Поровну — сервис, чтобы посчитать поровну чек между друзьями. Создайте мероприятие, скиньте ссылку — и узнайте, кто сколько потратил и кто кому должен.{% endblock %}">
  <meta name="robots" content="{% block robots %}index, follow{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}Поровну — посчитать поровну чек{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Раздели расходы между друзьями: создай мероприятие, отправь ссылку — и получи расклад, кто сколько потратил и кто кому должен.{% endblock %}">
  <meta property="og:locale" content="ru_RU">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <img class="hero{% block hero_class %}{% endblock %}" src="/static/beach-night.svg" alt="Ночной пляж: яркая луна, костёр и гротескные силуэты друзей с гитарой у палаток">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
