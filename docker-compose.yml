services:
  web:
    image: ghcr.io/bigazzzz/rashod:latest
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: sqlite:////data/expenses.db
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${DOMAIN:-localhost}}
      TRUST_PROXY_HEADERS: "1" # Caddy is the only thing that can reach this container
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-365}
      OG_IMAGE_DIR: /data/og
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      # Shared with mcp. Empty = /internal/ops disabled (404).
      OPS_TOKEN: ${OPS_TOKEN:-}
      # Browser admin at /admin. Both required or /admin returns 404.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-1}
    volumes:
      - db_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp:
    image: ghcr.io/bigazzzz/rashod-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile.mcp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8080"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-${LOG_LEVEL:-INFO}}
      OPS_BASE_URL: http://web:8000
      OPS_TOKEN: ${OPS_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8080"
      MCP_RATE_LIMIT_PER_MINUTE: ${MCP_RATE_LIMIT_PER_MINUTE:-60}
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - mcp

  alloy:
    image: grafana/alloy:v1.22.0
    profiles: [observability]
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    environment:
      GRAFANA_METRICS_URL: ${GRAFANA_METRICS_URL:-}
      GRAFANA_METRICS_USER: ${GRAFANA_METRICS_USER:-}
      GRAFANA_LOGS_URL: ${GRAFANA_LOGS_URL:-}
      GRAFANA_LOGS_USER: ${GRAFANA_LOGS_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
      POROVNU_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - alloy_data:/var/lib/alloy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  caddy_data:
  caddy_config:
  alloy_data:
